<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAN Olympiad</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>MAN Olympiad</h1>

        <nav>
            <a href="#">Главная</a>
            <a href="#">Олимпиады</a>
            <a href="#">Результаты</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Олимпиады МАН</h2>

            <p>
                Участвуй в олимпиадах, решай задачи
                и соревнуйся с другими участниками.
            </p>

            <button onclick="startOlympiad()">
                Смотреть олимпиады
            </button>
        </section>

        <section class="olympiads">
            <h2>Ближайшие олимпиады</h2>

            <div class="olympiad-card">
                <h3>Олимпиада по информатике</h3>
                <p>10 задач · 180 минут</p>

                <button>Подробнее</button>
            </div>

            <div class="olympiad-card">
                <h3>Олимпиада по математике</h3>
                <p>15 задач · 120 минут</p>

                <button>Подробнее</button>
            </div>
        </section>
    </main>

    <footer>
        <p>MAN Olympiad © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
