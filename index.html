<!DOCTYPE html>
<html lang="uk">
<head>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Олімпіада</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--mute:#767676;--line:#d4d4d4;--acc:#1b3fd1;--err:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#3a3a3a;--acc:#7f9bff;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#3a3a3a;--acc:#7f9bff;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 Manrope,system-ui,sans-serif}
main{max-width:380px;margin:0 auto;padding:max(12vh,64px) 24px 64px}
section{display:none;flex-direction:column;gap:28px}
section.on{display:flex}
h1{font-weight:300;font-size:2.4rem;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-weight:600;font-size:1.05rem;margin:0}
p{margin:0;color:var(--mute)}
input[type=text],input[type=email]{width:100%;border:0;border-bottom:1px solid var(--fg);background:transparent;color:var(--fg);font:inherit;padding:10px 0;border-radius:0;outline:0}
input:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--acc);outline-offset:4px}
input::placeholder{color:var(--mute)}
button{font:600 1rem Manrope,system-ui,sans-serif;background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:14px 20px;cursor:pointer;width:100%;border-radius:0}
button.ghost{background:transparent;color:var(--fg)}
button:hover{opacity:.85}
.err{color:var(--err);min-height:1.5em;font-size:.9rem}
.ok{color:var(--acc);font-size:.95rem}
.opt{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt input{accent-color:var(--acc);width:18px;height:18px;margin:0}
.task{display:flex;flex-direction:column;gap:12px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.task .meta{color:var(--mute);font-size:.85rem}
.back{background:none;border:0;color:var(--mute);width:auto;padding:0;text-align:left;font-weight:400}
main.wide{max-width:760px}
.pages{display:flex;flex-direction:column;gap:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.page{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;border:1px solid var(--line)}
@media print{#s-exam .pages{display:none}}
select{width:100%;border:0;border-bottom:1px solid var(--fg);background:transparent;color:var(--fg);font:inherit;padding:10px 0;border-radius:0;outline:0}
select:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
select option{background:var(--bg);color:var(--fg)}
.upbtn{display:inline-block;align-self:flex-start;position:relative;border:1px solid var(--fg);padding:12px 18px;cursor:pointer;font-weight:600}
.upbtn input{position:absolute;opacity:0;width:1px;height:1px}
.fi{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;word-break:break-all}
.fi.ph{color:var(--mute)}
.fi button{flex:none}
#theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;width:auto;padding:8px 12px;font-size:.85rem;font-weight:400;background:var(--bg);color:var(--fg);border:1px solid var(--line);z-index:5}
textarea{width:100%;min-height:120px;border:1px solid var(--fg);background:transparent;color:var(--fg);font:inherit;padding:10px;border-radius:0;outline:0;resize:vertical}
textarea:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
textarea[readonly]{opacity:.6}
.pages.collapsed{display:none}
.tgl{width:auto;align-self:flex-start;background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 14px;font-weight:400;font-size:.9rem}
a.tgl{color:var(--fg);text-decoration:none;display:inline-block}
</style>
</head>
<body>
<button id="theme" type="button"></button>
<main>

<section id="s-email" class="on">
  <h1>Вхід</h1>
  <label for="email"><p>Електронна пошта</p></label>
  <input id="email" type="email" placeholder="name@example.com" autocomplete="email">
  <div id="e-err" class="err"></div>
  <button id="b-email">Продовжити</button>
</section>

<section id="s-choice">
  <h1>Олімпіада</h1>
  <p id="who"></p>
  <div id="note" hidden>
    <p class="ok">Реєстрацію завершено. Ваш код доступу:</p>
    <div id="mycode" style="font:600 2rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;margin:12px 0;user-select:all"></div>
    <p>Збережіть його: він потрібен для входу на олімпіаду. <span id="mailed"></span></p>
  </div>
  <button id="b-reg">Зареєструватись на олімпіаду</button>
  <button id="b-login" class="ghost">Увійти на олімпіаду</button>
  <button class="back" data-go="s-email">Змінити пошту</button>
</section>

<section id="s-name">
  <h1>Реєстрація</h1>
  <label for="fio"><p>Прізвище, ім’я та по батькові</p></label>
  <input id="fio" type="text" placeholder="Шевченко Тарас Григорович" autocomplete="name">
  <div id="n-err" class="err"></div>
  <button id="b-name">Далі</button>
  <button class="back" data-go="s-choice">Назад</button>
</section>

<section id="s-region">
  <h1>Школа</h1>
  <label for="reg"><p>Область</p></label>
  <select id="reg"><option value="">Оберіть область</option><option>Вінницька область</option><option>Волинська область</option><option>Дніпропетровська область</option><option>Донецька область</option><option>Житомирська область</option><option>Закарпатська область</option><option>Запорізька область</option><option>Івано-Франківська область</option><option>Київська область</option><option>Кіровоградська область</option><option>Луганська область</option><option>Львівська область</option><option>Миколаївська область</option><option>Одеська область</option><option>Полтавська область</option><option>Рівненська область</option><option>Сумська область</option><option>Тернопільська область</option><option>Харківська область</option><option>Херсонська область</option><option>Хмельницька область</option><option>Черкаська область</option><option>Чернівецька область</option><option>Чернігівська область</option><option>м. Київ</option><option>АР Крим</option><option>м. Севастополь</option></select>
  <label for="dist" id="ld" hidden><p>Район</p></label>
  <select id="dist" hidden></select>
  <label for="school-sel" id="ls" hidden><p>Школа</p></label>
  <select id="school-sel" hidden></select>
  <label for="school" id="lt" hidden><p>Школа (назва або номер)</p></label>
  <input id="school" type="text" placeholder="Харківський Академічний Ліцей № 45" autocomplete="organization" hidden>
  <div id="r-err" class="err"></div>
  <button id="b-region">Далі</button>
  <button class="back" data-go="s-name">Назад</button>
</section>

<section id="s-class">
  <h1>Клас</h1>
  <div id="classes"></div>
  <div id="k-err" class="err"></div>
  <button id="b-class">Далі</button>
  <button class="back" data-go="s-region">Назад</button>
</section>

<section id="s-pick">
  <h1>Оберіть олімпіаду</h1>
  <div id="list"></div>
  <div id="p-err" class="err"></div>
  <button id="b-pick">Завершити реєстрацію</button>
  <button class="back" data-go="s-class">Назад</button>
</section>

<section id="s-code">
  <h1>Код доступу</h1>
  <label for="code"><p>Введіть код доступу (8 літер і цифр)</p></label>
  <input id="code" type="text" maxlength="8" placeholder="XXXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:.12em">
  <div id="c-err" class="err"></div>
  <button id="b-code">Увійти</button>
  <button class="back" data-go="s-choice">Назад</button>
</section>

<section id="s-exam">
  <h1 id="ex-title">Математика</h1>
  <p id="ex-who"></p>
  <p id="timer"></p>
  <div id="tasks"></div>
  <div id="x-err" class="err"></div>
  <button id="b-send">Надіслати відповіді</button>
</section>

<section id="s-done">
  <h1>Відповіді надіслано</h1>
  <p>Дякуємо за участь. Результати буде опубліковано після перевірки.</p>
  <button id="b-home">На початок</button>
</section>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var root=document.documentElement,b=document.getElementById("theme");
  function cur(){var t=root.getAttribute("data-theme");if(t)return t;return window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"}
  function apply(t,save){
    root.setAttribute("data-theme",t);
    b.textContent=t==="dark"?"Світла тема":"Темна тема";
    b.setAttribute("aria-label",t==="dark"?"Увімкнути світлу тему":"Увімкнути темну тему");
    if(save){try{localStorage.setItem("theme",t)}catch(e){}}
  }
  apply(cur(),false);
  b.onclick=function(){apply(cur()==="dark"?"light":"dark",true)};
})();
var st={email:"",fio:"",olymp:""};
function $(i){return document.getElementById(i)}
function show(id){
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===id)});
  document.querySelector("main").classList.toggle("wide",id==="s-exam");
  var f=document.querySelector("#"+id+" input[type=email],#"+id+" input[type=text]");
  if(f)f.focus({preventScroll:true});
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){show(b.dataset.go)}});

// пошта й ім'я зберігаються в адресі (#e=…&n=…) — після реєстрації повертаємось на вибір «вхід / реєстрація»
function setHash(){var p=new URLSearchParams();if(st.email)p.set("e",st.email);if(st.fio)p.set("n",st.fio);history.replaceState(null,"",location.pathname+location.search+(p.toString()?"#"+p.toString():""))}
function clearHash(){history.replaceState(null,"",location.pathname+location.search)}
function toChoice(){$("who").textContent=st.email+(st.fio?" · "+st.fio:"");show("s-choice")}
// 1. email
$("b-email").onclick=function(){
  var v=$("email").value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){$("e-err").textContent="Введіть коректну електронну пошту.";return}
  $("e-err").textContent="";st.email=v;setHash();$("note").hidden=true;toChoice();
};
$("s-choice").querySelector("[data-go]").addEventListener("click",function(){st.email="";st.fio="";$("email").value="";$("fio").value="";clearHash()});
// 2. choice
$("b-reg").onclick=function(){$("note").hidden=true;if(st.fio)$("fio").value=st.fio;show("s-name")};
$("b-login").onclick=function(){$("code").value="";$("c-err").textContent="";show("s-code")};
// reg: name
$("b-name").onclick=function(){
  var v=$("fio").value.trim().replace(/\s+/g," ");
  if(v.split(" ").length<2){$("n-err").textContent="Вкажіть щонайменше прізвище та ім’я.";return}
  $("n-err").textContent="";st.fio=v;setHash();show("s-region");loadGeo();
};
// reg: область → район → школа (списки з таблиць «області», «райони», «школи»)
var GEO=null,SCHL=null;
function opt(t,v){var o=document.createElement("option");o.textContent=t;o.value=v;return o}
function loadGeo(){
  if(GEO)return;
  api({action:"geo"}).then(function(d){
    if(!d.ok||!d.regions||!d.regions.length)return;   // немає таблиць — лишається запасний список і ручне введення школи
    GEO=d;var sel=$("reg");sel.innerHTML="";
    sel.appendChild(opt("Оберіть область",""));
    d.regions.forEach(function(r){sel.appendChild(opt(r,r))});
  }).catch(function(){});
}
function syncSchool(){
  var list=!!(SCHL&&SCHL.length),picked=$("reg").value!=="",needD=!$("dist").hidden,dOk=!needD||$("dist").value!=="";
  var other=$("school-sel").value==="__other";
  $("ls").hidden=$("school-sel").hidden=!(picked&&dOk&&list);
  $("lt").hidden=$("school").hidden=!(picked&&dOk&&(!list||other));
}
function loadSchoolList(r,d){
  var ss=$("school-sel");ss.innerHTML="";SCHL=null;
  api({action:"schools",region:r,district:d}).then(function(x){
    if($("reg").value!==r||($("dist").hidden?"":$("dist").value)!==d)return;
    SCHL=(x.ok&&x.list)||[];
    if(SCHL.length){
      ss.appendChild(opt("Оберіть школу",""));SCHL.forEach(function(n){ss.appendChild(opt(n,n))});
      ss.appendChild(opt("Моєї школи немає в списку","__other"));
    }
    syncSchool();
  }).catch(function(){SCHL=[];syncSchool()});
}
$("reg").onchange=function(){
  var r=this.value;SCHL=null;$("school-sel").innerHTML="";$("dist").innerHTML="";$("ld").hidden=$("dist").hidden=true;
  if(r===""){syncSchool();return}
  var ds=GEO&&GEO.districts[r];
  if(ds&&ds.length){
    $("dist").appendChild(opt("Оберіть район",""));ds.forEach(function(x){$("dist").appendChild(opt(x,x))});
    $("ld").hidden=$("dist").hidden=false;syncSchool();
  }else if(GEO){loadSchoolList(r,"")}else syncSchool();
};
$("dist").onchange=function(){
  SCHL=null;$("school-sel").innerHTML="";
  if(this.value==="")syncSchool();else loadSchoolList($("reg").value,this.value);
};
$("school-sel").onchange=function(){syncSchool();if(this.value==="__other")$("school").focus()};
$("b-region").onclick=function(){
  var r=$("reg").value,e=$("r-err");
  if(r===""){e.textContent="Оберіть область.";return}
  var dv="";
  if(!$("dist").hidden){dv=$("dist").value;if(dv===""){e.textContent="Оберіть район.";return}}
  var sc;
  if(!$("school-sel").hidden){
    var sv=$("school-sel").value;
    if(sv===""){e.textContent="Оберіть школу.";return}
    sc=sv==="__other"?$("school").value:sv;
  }else sc=$("school").value;
  sc=sc.trim().replace(/\s+/g," ");
  if(sc.length<2){e.textContent="Вкажіть школу.";return}
  e.textContent="";st.region=r;st.district=dv;st.school=sc;show("s-class");
};
// reg: class
$("classes").innerHTML=[5,6,7,8,9,10,11].map(function(k){
  return '<label class="opt"><input type="radio" name="kl" value="'+k+'"><span>'+k+' клас</span></label>'}).join("");
$("b-class").onclick=function(){
  var r=document.querySelector("input[name=kl]:checked");
  if(!r){$("k-err").textContent="Оберіть клас.";return}
  $("k-err").textContent="";st.klass=r.value;show("s-pick");loadPick();
};
// reg: pick — лише олімпіади, у яких є папки його області та району
var WEB_APP_URL="https://script.google.com/macros/s/AKfycbyst9nVqoViHYjR2KKP_Jgmir1SIIFI-MRlq5heSY5Dvc6YJ3Ec6tVjgnmkktpM3rYg/exec";
function fmt(ms){return new Date(ms).toLocaleString("uk-UA",{timeZone:"Europe/Kyiv",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function loadPick(){
  $("list").innerHTML="<p>Завантаження…</p>";$("b-pick").disabled=true;$("p-err").textContent="";
  api({action:"status",region:st.region,district:st.district}).then(function(d){
    if(!d.ok)throw new Error(d.error||"помилка сервера");
    var names=Object.keys(d.st);
    if(!names.length){$("list").innerHTML="";$("p-err").textContent="Для вашої області та району зараз немає олімпіад.";return}
    var any=false;
    $("list").innerHTML=names.map(function(o){
      var s=(d.st[o]&&d.st[o].reg)||{s:"closed"},open=s.s==="open";any=any||open;
      var note=open?(s.until?"відкрито до "+fmt(s.until):""):s.s==="soon"?"відкриється "+fmt(s.at):"реєстрацію закрито";
      return '<label class="opt"'+(open?'':' style="opacity:.5"')+'><input type="radio" name="ol" value="'+o+'"'+(open?'':' disabled')+'><span>'+o+(note?'<br><small style="color:var(--mute)">'+note+'</small>':'')+'</span></label>'}).join("");
    $("b-pick").disabled=!any;
    if(!any)$("p-err").textContent="Реєстрація зараз закрита.";
  }).catch(function(e){var m=(e&&e.message)||"";if(e instanceof SyntaxError||m==="Failed to fetch")m="сервер не відповідає: не оновлено або не авторизовано";$("list").innerHTML="";$("p-err").textContent="Не вдалося завантажити список ("+m+"). Оновіть сторінку."});
}
$("b-pick").onclick=function(){
  var r=document.querySelector("input[name=ol]:checked");
  if(!r){$("p-err").textContent="Оберіть одну олімпіаду.";return}
  st.olymp=r.value;$("p-err").textContent="";
  var btn=$("b-pick");btn.disabled=true;btn.textContent="Збереження…";
  fetch(WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({email:st.email,fio:st.fio,olymp:st.olymp,region:st.region,district:st.district,school:st.school,klass:st.klass})})
  .then(function(x){return x.json()})
  .then(function(d){
    if(!d.ok)throw new Error(d.error||"error");
    $("reg").value="";$("dist").innerHTML="";$("school").value="";$("school-sel").innerHTML="";SCHL=null;
    $("ld").hidden=$("dist").hidden=true;syncSchool();r.checked=false;
    var kr=document.querySelector("input[name=kl]:checked");if(kr)kr.checked=false;
    $("mycode").textContent=d.code;
    $("mailed").textContent=d.mailed?"Копію також надіслано на вашу пошту.":"";
    $("note").hidden=false;toChoice();
  })
  .catch(function(e){var m=e&&e.message;$("p-err").textContent=m==="exists"?"Ви вже зареєстровані на цю олімпіаду.":m==="closed"?"Реєстрацію на цю олімпіаду закрито.":m==="unavailable"?"Ця олімпіада недоступна для вашої області або району.":"Не вдалося зберегти ("+(m==="missing fields"?"не заповнені область, школа або клас — поверніться назад і перевірте":(e instanceof SyntaxError||m==="Failed to fetch")?"сервер не відповідає: не оновлено розгортання або немає дозволів":m)+"). Спробуйте ще раз."})
  .finally(function(){btn.disabled=false;btn.textContent="Завершити реєстрацію"});
};
// login: code
function enter(){
  var c=$("code").value.trim().toUpperCase();
  if(c.length!==8){$("c-err").textContent="Код має містити 8 символів.";return}
  var btn=$("b-code");btn.disabled=true;btn.textContent="Перевірка…";
  fetch(WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"login",code:c})})
  .then(function(x){return x.json()})
  .then(function(d){
    if(!d.ok)throw new Error(d.error==="closed"?(d.state==="soon"?"soon:"+d.at:"closed"):"bad");
    $("c-err").textContent="";st.email=d.email;st.fio=d.fio;st.olymp=d.olymp;st.code=c;
    st.until=d.until;st.off=d.now-Date.now();st.files=d.files||[];st.texts=d.texts||{};
    if(d.submitted){show("s-done");return}
    openExam();
  })
  .catch(function(e){var m=(e&&e.message)||"";$("c-err").textContent=m==="closed"?"Вхід на цю олімпіаду зараз закритий.":m.indexOf("soon:")===0?"Вхід відкриється "+fmt(+m.slice(5))+".":"Невірний код або немає зв’язку. Спробуйте ще раз."})
  .finally(function(){btn.disabled=false;btn.textContent="Увійти"});
}
var PDF_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",pdfReady=null;
function api(body){
  return fetch(WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(x){return x.json()});
}
function initPdf(){
  if(!pdfReady)pdfReady=fetch(PDF_WORKER).then(function(r){return r.text()}).then(function(t){
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}));
  });
  return pdfReady;
}
function b64ToBytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function stamp(ctx,w,h){
  ctx.save();ctx.globalAlpha=.07;ctx.fillStyle="#000";ctx.font="600 "+Math.round(w/30)+"px sans-serif";
  ctx.rotate(-Math.PI/6);var t=st.fio+" · "+st.code;
  for(var y=-h;y<h*1.5;y+=w/5)for(var x=-w;x<w*1.5;x+=w/1.6)ctx.fillText(t,x,y);
  ctx.restore();
}
// Кнопка «Завантажити завдання» — лише для завдань, у таблиці яких указано «файл»
function addDownload(box,bytes,name){
  var a=document.createElement("a");a.className="tgl";a.textContent="Завантажити завдання (PDF)";
  a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=name;
  box.parentNode.insertBefore(a,box);
}
async function renderPdf(bytes,box){
  await initPdf();
  var pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  if(pdf.numPages>2){   // довгі завдання (3+ сторінок) можна згорнути
    var tg=document.createElement("button");tg.type="button";tg.className="tgl";
    tg.setAttribute("aria-controls",box.id);
    var lab=function(){var c=box.classList.contains("collapsed");tg.textContent=(c?"Розгорнути завдання":"Згорнути завдання")+" ("+pdf.numPages+" стор.)";tg.setAttribute("aria-expanded",c?"false":"true")};
    tg.onclick=function(){box.classList.toggle("collapsed");lab()};
    lab();box.parentNode.insertBefore(tg,box);
  }
  var dpr=Math.min(window.devicePixelRatio||1,2),cw=box.clientWidth||700;
  for(var n=1;n<=pdf.numPages;n++){
    var page=await pdf.getPage(n),v0=page.getViewport({scale:1}),v=page.getViewport({scale:cw*dpr/v0.width});
    var cv=document.createElement("canvas");cv.width=Math.floor(v.width);cv.height=Math.floor(v.height);
    var ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:v}).promise;
    stamp(ctx,cv.width,cv.height);
    var img=new Image();img.className="page";img.alt="Сторінка "+n;img.draggable=false;
    img.src=cv.toDataURL("image/jpeg",.85);box.appendChild(img);
  }
}
var tmr=null;
var OKEXT=["pdf","jpg","jpeg","png","webp","heic","doc","docx","txt"];
function fileRow(list,f){
  var row=document.createElement("div");row.className="fi";
  var n=document.createElement("span");n.textContent=f.name;row.appendChild(n);
  if(!st.locked&&!st.ending){
    var x=document.createElement("button");x.className="back";x.textContent="Видалити";x.setAttribute("aria-label","Видалити "+f.name);
    x.onclick=function(){x.disabled=true;api({action:"delfile",code:st.code,id:f.id}).then(function(d){if(!d.ok)throw 0;row.remove()}).catch(function(){x.disabled=false;$("x-err").textContent="Не вдалося видалити файл."})};
    row.appendChild(x);
  }
  list.appendChild(row);
}
function uploadFiles(k,files,list){
  Array.prototype.forEach.call(files,function(file){
    var ext=(file.name.split(".").pop()||"").toLowerCase();
    if(OKEXT.indexOf(ext)<0){$("x-err").textContent="Тип файлу не підтримується ("+file.name+"). Дозволено: "+OKEXT.join(", ")+".";return}
    if(file.size>10*1024*1024){$("x-err").textContent="Файл завеликий (макс. 10 МБ): "+file.name;return}
    var ph=document.createElement("div");ph.className="fi ph";ph.textContent="Завантаження: "+file.name+"…";list.appendChild(ph);
    var fr=new FileReader();
    fr.onload=function(){
      api({action:"upload",code:st.code,task:k,name:file.name,mime:file.type,b64:String(fr.result).split(",")[1]}).then(function(d){
        ph.remove();
        if(!d.ok){$("x-err").textContent=d.error==="closed"?"Час вийшов, файл не прийнято.":d.error==="submitted"?"Відповіді вже надіслано.":"Не вдалося завантажити "+file.name+". Спробуйте ще раз.";return}
        $("x-err").textContent="";fileRow(list,{id:d.id,name:d.name});
      }).catch(function(){ph.remove();$("x-err").textContent="Не вдалося завантажити "+file.name+". Перевірте з’єднання."});
    };
    fr.readAsDataURL(file);
  });
}
// Час вийшов: блокуємо додавання файлів; усе вже завантажене лишається збереженим
function saveTexts(final){
  var list=Array.prototype.filter.call(document.querySelectorAll("#tasks textarea"),function(x){return x.value!==x.dataset.saved});
  if(!list.length||(st.locked&&final!==true))return Promise.resolve(true);
  return Promise.all(list.map(function(x){
    var v=x.value;
    return api({action:"text",code:st.code,task:+x.dataset.k,text:v}).then(function(d){
      if(d.ok){x.dataset.saved=v;return true}
      if(d.error==="closed"&&!st.ending)endExam();
      return false;
    }).catch(function(){return false});
  })).then(function(a){return a.every(Boolean)});
}
// Час вийшов: блокуємо відповіді й востаннє зберігаємо введений текст; завантажені файли вже збережені
function endExam(){
  if(st.ending)return;st.ending=true;clearInterval(tmr);clearInterval(st.tsv);$("timer").textContent="";
  document.querySelectorAll("#tasks .upbtn").forEach(function(x){x.style.display="none"});
  document.querySelectorAll("#tasks .fi button").forEach(function(x){x.remove()});
  document.querySelectorAll("#tasks textarea").forEach(function(x){x.readOnly=true});
  $("b-send").hidden=true;
  $("x-err").textContent="Олімпіаду завершено. Зберігаємо останні зміни…";
  saveTexts(true).then(function(ok){
    st.locked=true;
    $("x-err").textContent=ok?"Олімпіаду завершено. Усе, що ви встигли ввести, збережено.":"Олімпіаду завершено. Збережено все до останнього автозбереження.";
  });
}
function startExam(){
  st.locked=false;st.ending=false;clearInterval(tmr);
  function tick(){
    if(!st.until){$("timer").textContent="";return}
    var left=st.until-(Date.now()+st.off);
    if(left<=0){endExam();return}
    var s=Math.floor(left/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
    $("timer").textContent="Залишилось: "+(h?h+" год ":"")+m+" хв "+(s%60)+" с";
  }
  tick();tmr=setInterval(tick,1000);
}
var TASKERR={"no folder":"Папку цієї олімпіади не знайдено на Диску. Зверніться до організатора.","no class":"Для вашого класу немає папки «завдання». Зверніться до організатора.","no pdf":"У папці «завдання» вашого класу немає PDF-файлів. Зверніться до організатора."};
async function openExam(){
  $("ex-title").textContent=st.olymp||"Олімпіада";
  $("ex-who").textContent=st.fio;
  $("tasks").innerHTML="<p>Завантаження завдань…</p>";
  $("x-err").textContent="";$("b-send").hidden=true;
  show("s-exam");
  try{
    var r=await api({action:"files",code:st.code});
    if(!r.ok)throw new Error(r.error||"none");if(!r.files.length)throw new Error("no pdf");
    $("tasks").innerHTML=r.files.map(function(f,k){
      return '<div class="task"><span class="meta">Завдання '+(k+1)+' з '+r.files.length+'</span><div class="pages" id="pg'+k+'"><p>Завантаження…</p></div>'+
      ((r.types||[])[k]==="text"
        ?'<label for="tx'+(k+1)+'"><p>Ваша відповідь</p></label><textarea id="tx'+(k+1)+'" data-k="'+(k+1)+'" maxlength="20000"></textarea>'
        :'<label class="upbtn">Додати файл відповіді<input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.doc,.docx,.txt" data-k="'+(k+1)+'"></label><div class="flist" id="fl'+(k+1)+'"></div>')+'</div>'}).join("");
    startExam();
    document.querySelectorAll("#tasks textarea").forEach(function(x){
      var v=(st.texts||{})[x.dataset.k]||"";x.value=v;x.dataset.saved=v;x.onblur=saveTexts;
    });
    clearInterval(st.tsv);st.tsv=setInterval(saveTexts,20000);
    (st.files||[]).forEach(function(f){var l=$("fl"+f.task);if(l)fileRow(l,f)});
    document.querySelectorAll("#tasks input[type=file]").forEach(function(x){
      x.onchange=function(){uploadFiles(+x.dataset.k,x.files,$("fl"+x.dataset.k));x.value=""};
    });
    for(var i=0;i<r.files.length;i++){
      var box=$("pg"+i),p=await api({action:"pdf",code:st.code,id:r.files[i].id});
      if(!p.ok)throw new Error("pdf");
      var bytes=b64ToBytes(p.b64);
      box.innerHTML="";
      if((r.dl||[])[i])addDownload(box,bytes,r.files[i].name||("Завдання-"+(i+1)+".pdf"));
      await renderPdf(bytes,box);
    }
    $("b-send").hidden=false;
  }catch(e){
    $("tasks").innerHTML='<p class="err" style="min-height:0">'+(TASKERR[e&&e.message]||"Не вдалося завантажити завдання. Оновіть сторінку або зверніться до організатора.")+(r&&r.where?'<br><small style="color:var(--mute)">Шукали: '+r.where.replace(/</g,"&lt;")+'</small>':'')+'</p>';
  }
}
$("b-code").onclick=enter;
$("code").onkeydown=function(e){if(e.key==="Enter")enter()};
// exam
$("b-send").onclick=function(){
  if(document.querySelector("#tasks .fi.ph")){$("x-err").textContent="Зачекайте: файли ще завантажуються.";return}
  var empty=0;
  document.querySelectorAll("#tasks .flist").forEach(function(l){if(!l.querySelector(".fi"))empty++});
  document.querySelectorAll("#tasks textarea").forEach(function(x){if(!x.value.trim())empty++});
  if(empty&&!window.confirmed){$("x-err").textContent="Завдань без відповіді: "+empty+". Натисніть ще раз, щоб надіслати.";window.confirmed=true;return}
  window.confirmed=false;$("x-err").textContent="";
  var b=$("b-send");b.disabled=true;
  saveTexts(true).then(function(ok){
    if(!ok)throw 0;
    return api({action:"finish",code:st.code});
  }).then(function(d){
    if(!d.ok){if(d.error==="closed")endExam();else if(d.error==="submitted"){show("s-done");return}throw 0}
    st.locked=true;clearInterval(tmr);clearInterval(st.tsv);show("s-done");
  }).catch(function(){if(!st.ending)$("x-err").textContent="Не вдалося надіслати. Спробуйте ще раз."})
  .finally(function(){b.disabled=false});
};
$("b-home").onclick=function(){$("email").value="";st={email:"",fio:"",olymp:""};show("s-email")};
document.addEventListener("contextmenu",function(e){if(e.target.closest&&e.target.closest(".pages"))e.preventDefault()});
syncSchool();loadGeo();
(function(){var p=new URLSearchParams(location.hash.slice(1)),e=p.get("e");if(e){st.email=e;st.fio=p.get("n")||"";$("email").value=e;if(st.fio)$("fio").value=st.fio;toChoice()}})();
// enter key on email/name
$("email").onkeydown=function(e){if(e.key==="Enter")$("b-email").click()};
$("fio").onkeydown=function(e){if(e.key==="Enter")$("b-name").click()};
</script>
