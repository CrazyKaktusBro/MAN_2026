<!DOCTYPE html>
<html lang="uk">
<head>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перевірка робіт</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="check">
<button id="theme" type="button"></button>
<main id="m">

<section id="s1" class="on">
  <h1>Перевірка</h1>
  <label for="em"><p>Електронна пошта журі</p></label>
  <input id="em" type="text" inputmode="email" placeholder="name@example.com" autocomplete="email">
  <div id="e1" class="err"></div>
  <button id="b1">Надіслати код</button>
</section>

<section id="s1b">
  <h1>Код з пошти</h1>
  <p>Якщо цю пошту знайдено в таблиці журі, на неї надіслано 6-значний код. Він діє 10 хвилин.</p>
  <label for="cd"><p>Код підтвердження</p></label>
  <input id="cd" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
  <div id="e1b" class="err"></div>
  <button id="b1b">Увійти</button>
  <button class="back" id="back0">Назад</button>
</section>

<section id="s2">
  <h1>Олімпіада</h1>
  <div id="list"></div>
  <div id="e2" class="err"></div>
  <button id="b2">Далі</button>
  <button class="back" id="back1">Назад</button>
</section>

<section id="s2c">
  <h1>Клас</h1>
  <div id="clist"></div>
  <div id="e2c" class="err"></div>
  <button id="b2c">Почати перевірку</button>
  <button class="back" id="back2c">Назад</button>
</section>

<section id="s3">
  <p id="info"></p>
  <div id="work"></div>
  <div id="e3" class="err"></div>
  <button id="b3">Зберегти й перейти до наступної</button>
  <button class="back" id="back2">Завершити перевірку</button>
</section>

<section id="s4">
  <h1>Усе перевірено</h1>
  <p>Неперевірених робіт у цій олімпіаді більше немає.</p>
  <button id="b4">Завершити</button>
</section>

</main>
<script>
(function(){
  var root=document.documentElement,b=document.getElementById("theme");
  function cur(){var t=root.getAttribute("data-theme");if(t)return t;return window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"}
  function apply(t,save){
    root.setAttribute("data-theme",t);
    b.textContent=t==="dark"?"Світла тема":"Темна тема";
    b.setAttribute("aria-label",t==="dark"?"Увімкнути світлу тему":"Увімкнути темну тему");
    if(save){try{localStorage.setItem("theme",t)}catch(e){}}
  }
  apply(cur(),false);
  b.onclick=function(){apply(cur()==="dark"?"light":"dark",true)};
})();
var WEB_APP_URL="https://script.google.com/macros/s/AKfycbyst9nVqoViHYjR2KKP_Jgmir1SIIFI-MRlq5heSY5Dvc6YJ3Ec6tVjgnmkktpM3rYg/exec";
var st={};
function $(i){return document.getElementById(i)}
function api(b){return fetch(WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(function(x){return x.json()})}
function auth(){return {token:st.token}}
function show(id){
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===id)});
  $("m").classList.toggle("wide",id==="s3");window.scrollTo(0,0);
}
function b64ToBytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
var PDF_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",pdfReady=null;
function initPdf(){
  if(!pdfReady)pdfReady=fetch(PDF_WORKER).then(function(r){return r.text()}).then(function(t){
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}));
  });
  return pdfReady;
}
function addOpt(list,label,value,name){
  var l=document.createElement("label");l.className="opt";
  var r=document.createElement("input");r.type="radio";r.name=name;r.value=value;
  var sp=document.createElement("span");sp.textContent=label;
  l.appendChild(r);l.appendChild(sp);list.appendChild(l);
}
// сесія закінчилась → знову на вхід
function expired(d){if(d&&d.error==="bad session"){st={};$("e1").textContent="Сесія закінчилась. Увійдіть знову.";show("s1");return true}return false}
function err(d){return d.error==="forbidden"?"Ця робота поза вашою областю/районом.":"Помилка сервера: "+(d.error||"невідома")}

// 1. пошта → код на пошту
$("b1").onclick=function(){
  var e=$("em").value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){$("e1").textContent="Введіть коректну пошту.";return}
  st.email=e;$("e1").textContent="";$("b1").disabled=true;
  api({action:"g_login",email:e}).then(function(d){
    if(!d.ok){$("e1").textContent=d.error==="bad email"?"Введіть коректну пошту.":"Помилка сервера: "+(d.error||"невідома")+". Перевірте, що вставлено новий Results.gs і створено нову версію розгортання.";return}
    $("cd").value="";$("e1b").textContent="";show("s1b");
  }).catch(function(){$("e1").textContent="Немає зв’язку із сервером."}).finally(function(){$("b1").disabled=false});
};
$("em").onkeydown=function(e){if(e.key==="Enter")$("b1").click()};
$("back0").onclick=function(){show("s1")};
// 1б. код підтвердження
$("b1b").onclick=function(){
  var c=$("cd").value.trim();
  if(!/^\d{6}$/.test(c)){$("e1b").textContent="Код складається з 6 цифр.";return}
  $("e1b").textContent="";$("b1b").disabled=true;
  api({action:"g_verify",email:st.email,code:c}).then(function(d){
    if(!d.ok){$("e1b").textContent=d.error==="no folders"?"Для вашого акаунта не знайдено папок із роботами.":"Невірний або прострочений код.";return}
    st.token=d.token;st.nOl=d.olymps.length;$("list").innerHTML="";
    d.olymps.forEach(function(o){addOpt($("list"),o,o,"ol")});
    $("e2").textContent="";
    if(st.nOl===1){st.olymp=d.olymps[0];loadClasses();return}   // одна олімпіада — сторінку вибору пропускаємо
    show("s2");
  }).catch(function(){$("e1b").textContent="Немає зв’язку із сервером."}).finally(function(){$("b1b").disabled=false});
};
$("cd").onkeydown=function(e){if(e.key==="Enter")$("b1b").click()};
// 2. олімпіада
$("back1").onclick=function(){st={};show("s1")};
function loadClasses(){
  $("b2").disabled=true;$("e2").textContent="";
  api(Object.assign({action:"g_classes",olymp:st.olymp},auth())).then(function(d){
    if(expired(d))return;
    if(!d.ok){$("e2").textContent=err(d);show("s2");return}
    if(!d.list.length){$("e2").textContent="У цій олімпіаді немає папок класів.";show("s2");return}
    st.nCl=d.list.length;
    if(d.list.length===1){st.only=d.list[0];next();return}      // один клас — сторінку вибору пропускаємо
    var cl=$("clist");cl.innerHTML="";$("e2c").textContent="";
    addOpt(cl,"Усі класи (за порядком)","","kl");
    d.list.forEach(function(k){addOpt(cl,k+" клас",k,"kl")});
    cl.querySelector("input").checked=true;
    show("s2c");
  }).catch(function(){$("e2").textContent="Немає зв’язку із сервером.";show("s2")}).finally(function(){$("b2").disabled=false});
}
$("b2").onclick=function(){
  var r=document.querySelector("input[name=ol]:checked");
  if(!r){$("e2").textContent="Оберіть олімпіаду.";return}
  st.olymp=r.value;loadClasses();
};
$("back2c").onclick=function(){show("s2")};
$("b2c").onclick=function(){st.only=document.querySelector("input[name=kl]:checked").value;next()};
// 3. перевірка
function next(){
  show("s3");$("work").innerHTML="<p>Шукаємо роботу…</p>";$("info").textContent="";$("e3").textContent="";$("b3").hidden=true;
  api(Object.assign({action:"g_next",olymp:st.olymp,only:st.only||""},auth())).then(function(d){
    if(expired(d))return;
    if(!d.ok){$("work").innerHTML="";$("e3").textContent=err(d);return}
    if(d.done){show("s4");return}
    st.leaf=d.leaf;st.klass=d.klass;st.code=d.code;st.n=d.n;
    $("info").textContent=st.olymp+" · "+d.label+" · "+d.klass+" клас · робота "+d.code+" · у черзі в цьому класі: "+d.remaining;
    var w=$("work");w.innerHTML="";
    for(var k=1;k<=d.n;k++){
      var t=document.createElement("div");t.className="task";
      var h=document.createElement("h2");h.textContent="Завдання "+k;t.appendChild(h);
      var fb=document.createElement("div");fb.className="files";t.appendChild(fb);
      var mine=d.files.filter(function(f){return f.task===k});
      if(!mine.length){var p=document.createElement("p");p.textContent="Учень не додав відповіді до цього завдання.";fb.appendChild(p)}
      mine.forEach(function(f){var b=document.createElement("div");fb.appendChild(b);showFile(b,f)});
      var l=document.createElement("label");l.setAttribute("for","sc"+k);var lp=document.createElement("p");lp.textContent="Бали за завдання "+k;l.appendChild(lp);t.appendChild(l);
      var i=document.createElement("input");i.type="text";i.id="sc"+k;i.className="score";i.setAttribute("inputmode","decimal");i.setAttribute("autocomplete","off");i.placeholder="0";t.appendChild(i);
      w.appendChild(t);
    }
    $("b3").hidden=false;
  }).catch(function(){$("work").innerHTML="";$("e3").textContent="Немає зв’язку із сервером."});
}
async function showFile(box,f){
  box.textContent="Завантаження: "+f.name+"…";
  try{
    var r=await api(Object.assign({action:"g_file",leaf:st.leaf,klass:st.klass,code:st.code,id:f.id},auth()));
    if(!r.ok)throw 0;
    var bytes=b64ToBytes(r.b64),ext=f.name.split(".").pop().toLowerCase();box.textContent="";
    if(["jpg","jpeg","png","webp"].indexOf(ext)>=0){
      var im=new Image();im.alt=f.name;im.src=URL.createObjectURL(new Blob([bytes],{type:"image/"+(ext==="jpg"?"jpeg":ext)}));box.appendChild(im);
    }else if(ext==="pdf"){
      await initPdf();
      var pdf=await pdfjsLib.getDocument({data:bytes}).promise,cw=box.clientWidth||700,dpr=Math.min(window.devicePixelRatio||1,2);
      for(var n=1;n<=pdf.numPages;n++){
        var page=await pdf.getPage(n),v0=page.getViewport({scale:1}),v=page.getViewport({scale:cw*dpr/v0.width});
        var cv=document.createElement("canvas");cv.width=Math.floor(v.width);cv.height=Math.floor(v.height);
        await page.render({canvasContext:cv.getContext("2d"),viewport:v}).promise;box.appendChild(cv);
      }
    }else if(ext==="txt"){
      var pre=document.createElement("pre");pre.textContent=new TextDecoder().decode(bytes);box.appendChild(pre);
    }else{
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes]));a.download=f.name;a.textContent="Завантажити файл: "+f.name;box.appendChild(a);
    }
  }catch(e){box.textContent="Не вдалося відкрити файл: "+f.name}
}
$("b3").onclick=function(){
  var sc=[];
  for(var k=1;k<=st.n;k++){
    var v=$("sc"+k).value.trim().replace(",",".");
    if(v===""||isNaN(+v)||+v<0){$("e3").textContent="Вкажіть бал за кожне завдання числом (0, якщо відповіді немає). Перевірте завдання "+k+".";$("sc"+k).focus();return}
    sc.push(v);
  }
  $("e3").textContent="";$("b3").disabled=true;
  api(Object.assign({action:"g_save",leaf:st.leaf,klass:st.klass,code:st.code,scores:sc},auth())).then(function(d){
    if(expired(d))return;
    if(d.ok||d.error==="already"){next();return}
    $("e3").textContent=d.error==="bad scores"?"Некоректні бали.":"Не вдалося зберегти: "+(d.error||"помилка");
  }).catch(function(){$("e3").textContent="Не вдалося зберегти. Перевірте з’єднання й натисніть ще раз."})
  .finally(function(){$("b3").disabled=false});
};
// назад: на вибір класу / олімпіади, якщо вони були; інакше — на вхід
function leave(){if(st.nCl>1)show("s2c");else if(st.nOl>1)show("s2");else{st={};$("em").value="";show("s1")}}
$("back2").onclick=leave;
$("b4").onclick=leave;
</script>
</body>
</html>
